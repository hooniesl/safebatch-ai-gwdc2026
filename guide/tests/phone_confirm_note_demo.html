<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
  body { font-family: -apple-system, "Apple SD Gothic Neo", Roboto, sans-serif; margin: 0; background: #f4f5f7; color: #1c1c1e; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 12px 12px 80px; }
  .card { background: #fff; border-radius: 12px; padding: 14px; margin: 10px 0; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .warn { background: #fff7e6; border: 1px solid #ffd591; }
  .bad { background: #fff1f0; border: 1px solid #ffa39e; }
  .good { background: #f6ffed; border: 1px solid #b7eb8f; }
  h1 { font-size: 18px; margin: 6px 0 2px; }
  h2 { font-size: 15px; margin: 0 0 8px; }
  .muted { color: #666; font-size: 12px; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 10px; background: #eee; margin-right: 4px; }
  .badge.ai { background: #e6f4ff; color: #0958d9; }
  button { font-size: 16px; padding: 12px 14px; border-radius: 10px; border: 0; background: #1677ff; color: #fff; width: 100%; margin: 6px 0; }
  button.secondary { background: #fff; color: #222; border: 1px solid #ccc; }
  button.danger { background: #fff; color: #b71c1c; border: 1px solid #e57373; }
  button:disabled { background: #cfd8dc; color: #666; border: 0; }
  input[type=text] { width: 100%; box-sizing: border-box; font-size: 16px; padding: 12px; border-radius: 10px; border: 1px solid #bbb; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td { padding: 6px 4px; border-bottom: 1px solid #eee; vertical-align: top; word-break: break-all; }
  td:first-child { color: #555; width: 34%; }
  .mono { font-family: Menlo, monospace; font-size: 12px; }
  .chat { min-height: 40px; }
  .msg { padding: 8px 10px; border-radius: 10px; margin: 6px 0; font-size: 15px; }
  .me { background: #e6f4ff; text-align: right; }
  .bot { background: #f0f0f0; }
</style><style>body{max-width:640px;margin:16px auto;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif}</style></head><body>
<h3>표시 검사(모의 응답 렌더 · 실제 서버 응답 JSON 과 같은 형식 · 서명·전송 없음)</h3>
<div id="chat"></div>
<div class="card warn" id="confirmCard"><h2>③ 확인</h2><table id="orderTable"></table></div>
<script src="../phone_client.js"></script>
<script>
const r = {"kind": "proposal", "kind_detail": "normal", "text": "맥북 지갑의 트론 2개", "understood": {"asset": "TRX", "amount_trx": "2", "alias_input": "맥북지갑", "alias_match": "space_or_particle_tolerant", "alias_heard": "지갑"}, "proposal": {"alias": "맥북지갑", "address": "TEQh4L9pabnbW4UpHmxXveY31Q3FLsRHHz", "amount_trx": "2", "address_confirmed_at": "2026-09-21 (사장 TronLink 화면)"}, "fee_cap_trx": "2", "ai": {"mode": "KILN_LIVE", "note": "Kiln qwen3-32b 실호출", "fallback": "budget gate refused (used 4/4) → 규칙 파서(실제 AI 성공 아님)"}, "confirm_note": "받는 사람을 등록된 '맥북지갑' 으로 이해했습니다(입력 문장: '맥북 지갑의 트론 2개'). 아니면 진행하지 마세요."};
const $ = id => document.getElementById(id);
function addMsg(cls, text) { const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text; $("chat").appendChild(d); }
function renderTable(rows) { $("orderTable").innerHTML = rows.map(([k, v]) => `<tr><td>${k}</td><td class="${/주소|ID|지문/.test(k) ? "mono" : ""}">${v}</td></tr>`).join(""); }
addMsg("me", r.text);
addMsg("bot", `정리만 했습니다. 전송은 [서명] 후에만 됩니다. 이해한 내용: ${r.proposal.alias} (${r.proposal.address}) 에게 ${r.proposal.amount_trx} TRX · Nile.`);
renderTable([["받는 사람(별칭)", r.proposal.alias], ["받는 주소(전체)", r.proposal.address], ["보낼 수량", r.proposal.amount_trx + " TRX"], ["네트워크", "Nile 테스트넷"],
             ...SBClient.proposalNotice(r).rows, ["AI", r.ai.mode + " · " + r.ai.note + (r.ai.fallback ? " · " + r.ai.fallback : "")]]);
SBClient.proposalNotice(r).messages.forEach(m => addMsg("bot", m));
</script></body></html>
